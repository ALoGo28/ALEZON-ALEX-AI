<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEZON | Chat with Alex</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f0f; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 400px; background: #1a1a1a; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #333; }
        .chat-header { background: #222; padding: 15px; font-weight: bold; text-align: center; border-bottom: 1px solid #333; letter-spacing: 1px; }
        .chat-messages { height: 400px; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 80%; line-height: 1.4; word-wrap: break-word; }
        .message.user { background: #fff; color: #000; align-self: flex-end; }
        .message.assistant { background: #2a2a2a; color: #fff; align-self: flex-start; border: 1px solid #444; }
        .chat-input-area { display: flex; padding: 10px; background: #222; border-top: 1px solid #333; }
        .chat-input-area input { flex: 1; background: #111; border: 1px solid #444; border-radius: 6px; padding: 10px; color: #fff; outline: none; }
        .chat-input-area input:focus { border-color: #666; }
        .chat-input-area button { background: #fff; color: #000; border: none; padding: 10px 16px; margin-left: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .chat-input-area button:hover { background: #ddd; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">ALEZON — ALEX AI</div>
    <div id="chatMessages" class="chat-messages">
        <div class="message assistant">Hey there! What's good? Need help with sizing or curious about the drop?</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Ask Alex anything..." autocomplete="off">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const inputField = document.getElementById('userInput');
    let chatHistory = []; // Tracks multi-turn conversation history

    inputField.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') { sendMessage(); }
    });

    async function sendMessage() {
        const text = inputField.value.trim();
        if (!text) return;

        const chatMessages = document.getElementById('chatMessages');
        
        // 1. Append User Message to UI & history array
        chatMessages.innerHTML += `<div class="message user">${escapeHtml(text)}</div>`;
        chatHistory.push({ role: "user", content: text });
        inputField.value = '';
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try {
            // Automatically use localhost if you're testing locally, or your Render URL if it's hosted!
            const backendUrl = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
                ? 'http://127.0.0.1:8000/api/chat' 
                : 'https://alezon-alex-ai.onrender.com/api/chat'; // <-- Replace with your actual Render URL if it's different

            // 2. Send the full history array to your backend
            const response = await fetch(backendUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: chatHistory })
            });
            
            const data = await response.json();
            
            // 3. Append Assistant Response to UI & history array
            chatMessages.innerHTML += `<div class="message assistant">${escapeHtml(data.response)}</div>`;
            chatHistory.push({ role: "assistant", content: data.response });

            // 4. If a secure checkout link was returned, render the direct buy button!
            if (data.checkout_url) {
                chatMessages.innerHTML += `
                    <div class="message assistant" style="background: #111; border-color: #fff;">
                        <p style="margin: 0 0 8px 0;">Ready to complete your order?</p>
                        <a href="${data.checkout_url}" target="_blank" style="display: inline-block; background: #fff; color: #000; padding: 8px 14px; border-radius: 4px; text-decoration: none; font-weight: bold;">Proceed to Checkout</a>
                    </div>`;
            }

            chatMessages.scrollTop = chatMessages.scrollHeight;
        } catch (error) {
            chatMessages.innerHTML += `<div class="message assistant" style="color: #ff6b6b;">Error connecting to Alex's brain. Is Uvicorn running?</div>`;
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>

</body>
</html>
