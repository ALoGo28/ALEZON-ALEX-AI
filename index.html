<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ALEZON | Chat with Alex</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            background: #0f0f0f;
            color: #fff;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            margin: 0;
        }

        .chat-container {
            width: 400px;
            max-width: 95vw;

            background: #1a1a1a;

            border-radius: 12px;

            display: flex;
            flex-direction: column;

            overflow: hidden;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.5);

            border: 1px solid #333;
        }

        .chat-header {
            background: #222;

            padding: 15px;

            font-weight: bold;

            text-align: center;

            border-bottom: 1px solid #333;

            letter-spacing: 1px;
        }

        .chat-messages {
            height: 400px;

            overflow-y: auto;

            padding: 15px;

            display: flex;
            flex-direction: column;

            gap: 10px;
        }

        .message {
            padding: 10px 14px;

            border-radius: 8px;

            max-width: 80%;

            line-height: 1.4;

            word-wrap: break-word;

            overflow-wrap: break-word;
        }

        .message.user {
            background: #fff;

            color: #000;

            align-self: flex-end;
        }

        .message.assistant {
            background: #2a2a2a;

            color: #fff;

            align-self: flex-start;

            border: 1px solid #444;
        }

        .chat-input-area {
            display: flex;

            padding: 10px;

            background: #222;

            border-top: 1px solid #333;
        }

        .chat-input-area input {
            flex: 1;

            min-width: 0;

            background: #111;

            border: 1px solid #444;

            border-radius: 6px;

            padding: 10px;

            color: #fff;

            outline: none;
        }

        .chat-input-area input:focus {
            border-color: #666;
        }

        .chat-input-area button {
            background: #fff;

            color: #000;

            border: none;

            padding: 10px 16px;

            margin-left: 8px;

            border-radius: 6px;

            font-weight: bold;

            cursor: pointer;
        }

        .chat-input-area button:hover {
            background: #ddd;
        }

        .chat-input-area button:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }

        .typing {
            opacity: 0.7;

            font-style: italic;
        }

    </style>

</head>

<body>

<div class="chat-container">

    <div class="chat-header">
        ALEZON — ALEX AI
    </div>

    <div
        id="chatMessages"
        class="chat-messages"
    >

        <div class="message assistant">
            Hey there! What's good? Need help with
            sizing or curious about the drop?
        </div>

    </div>

    <div class="chat-input-area">

        <input
            type="text"
            id="userInput"
            placeholder="Ask Alex anything..."
            autocomplete="off"
        >

        <button
            id="sendButton"
            onclick="sendMessage()"
        >
            Send
        </button>

    </div>

</div>


<script>

    // ========================================================
    // CONFIGURATION
    // ========================================================

    const inputField =
        document.getElementById("userInput");

    const sendButton =
        document.getElementById("sendButton");

    const chatMessages =
        document.getElementById("chatMessages");


    // ========================================================
    // CHAT HISTORY
    // ========================================================

    let chatHistory = [];


    // ========================================================
    // ENTER KEY
    // ========================================================

    inputField.addEventListener(
        "keypress",
        function (event) {

            if (event.key === "Enter") {

                event.preventDefault();

                sendMessage();
            }

        }
    );


    // ========================================================
    // SEND MESSAGE
    // ========================================================

    async function sendMessage() {

        const text =
            inputField.value.trim();

        if (!text) {
            return;
        }


        // ----------------------------------------------------
        // Disable input while Alex responds
        // ----------------------------------------------------

        inputField.disabled = true;

        sendButton.disabled = true;


        // ----------------------------------------------------
        // Display user message
        // ----------------------------------------------------

        addMessage(
            text,
            "user"
        );


        // ----------------------------------------------------
        // Add user message to history
        // ----------------------------------------------------

        chatHistory.push({
            role: "user",
            content: text
        });


        inputField.value = "";


        scrollToBottom();


        // ----------------------------------------------------
        // Typing indicator
        // ----------------------------------------------------

        const typingElement =
            document.createElement("div");

        typingElement.className =
            "message assistant typing";

        typingElement.id =
            "typingIndicator";

        typingElement.textContent =
            "Alex is thinking...";

        chatMessages.appendChild(
            typingElement
        );

        scrollToBottom();


        try {

            // ------------------------------------------------
            // BACKEND URL
            // ------------------------------------------------

            const backendUrl =
    window.location.protocol === "file:" ||
    window.location.hostname === "localhost" ||
    window.location.hostname === "127.0.0.1"
        ? "http://127.0.0.1:8000/api/chat"
        : "https://alezon-alex-ai.onrender.com/api/chat";

            // ------------------------------------------------
            // PAYLOAD
            // ------------------------------------------------

            const payload = {
                messages: chatHistory
            };


            console.log(
                "Sending to Alex:",
                payload
            );


            // ------------------------------------------------
            // API REQUEST
            // ------------------------------------------------

            const response =
                await fetch(
                    backendUrl,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify(
                            payload
                        )
                    }
                );


            // ------------------------------------------------
            // READ RESPONSE
            // ------------------------------------------------

            const data =
                await response.json();


            console.log(
                "Alex API status:",
                response.status
            );

            console.log(
                "Alex API response:",
                data
            );


            // ------------------------------------------------
            // Remove typing indicator
            // ------------------------------------------------

            removeTypingIndicator();


            // ------------------------------------------------
            // Handle HTTP errors
            // ------------------------------------------------

            if (!response.ok) {

                let errorMessage =
                    `HTTP ${response.status}`;

                if (data.detail) {

                    if (Array.isArray(data.detail)) {

                        errorMessage +=
                            ": " +
                            data.detail
                                .map(
                                    error =>
                                        error.msg ||
                                        JSON.stringify(error)
                                )
                                .join("; ");

                    } else {

                        errorMessage +=
                            ": " +
                            data.detail;
                    }
                }

                throw new Error(
                    errorMessage
                );
            }


            // ------------------------------------------------
            // Get assistant response safely
            // ------------------------------------------------

            const responseText =
                data.response ||
                "Hey! How can I help you with ALEZON today?";


            // ------------------------------------------------
            // Display Alex response
            // ------------------------------------------------

            addMessage(
                responseText,
                "assistant"
            );


            // ------------------------------------------------
            // Add Alex response to history
            // ------------------------------------------------

            chatHistory.push({
                role: "assistant",
                content: responseText
            });


            // ------------------------------------------------
            // Checkout button
            // ------------------------------------------------

            if (data.checkout_url) {

                addCheckoutButton(
                    data.checkout_url
                );
            }


            scrollToBottom();


        } catch (error) {

            // ------------------------------------------------
            // Remove typing indicator
            // ------------------------------------------------

            removeTypingIndicator();


            console.error(
                "Alex connection error:",
                error
            );


            // ------------------------------------------------
            // Display error
            // ------------------------------------------------

            addMessage(
                "Sorry, I couldn't connect to Alex right now. " +
                "Please try again.",
                "assistant",
                true
            );


            // ------------------------------------------------
            // Detailed error for developers
            // ------------------------------------------------

            console.error(
                "Detailed backend error:",
                error.message
            );

        } finally {

            // ------------------------------------------------
            // Re-enable input
            // ------------------------------------------------

            inputField.disabled = false;

            sendButton.disabled = false;

            inputField.focus();

            scrollToBottom();
        }
    }


    // ========================================================
    // ADD MESSAGE
    // ========================================================

    function addMessage(
        text,
        role,
        isError = false
    ) {

        const messageElement =
            document.createElement("div");

        messageElement.className =
            `message ${role}`;

        if (isError) {

            messageElement.style.color =
                "#ff6b6b";
        }

        messageElement.textContent =
            text;

        chatMessages.appendChild(
            messageElement
        );
    }


    // ========================================================
    // CHECKOUT BUTTON
    // ========================================================

    function addCheckoutButton(
        checkoutUrl
    ) {

        const checkoutMessage =
            document.createElement("div");

        checkoutMessage.className =
            "message assistant";

        checkoutMessage.style.background =
            "#111";

        checkoutMessage.style.borderColor =
            "#fff";


        const text =
            document.createElement("p");

        text.textContent =
            "Ready to complete your order?";

        text.style.margin =
            "0 0 8px 0";


        const link =
            document.createElement("a");

        link.href =
            checkoutUrl;

        link.target =
            "_blank";

        link.rel =
            "noopener noreferrer";

        link.textContent =
            "Proceed to Checkout";

        link.style.display =
            "inline-block";

        link.style.background =
            "#fff";

        link.style.color =
            "#000";

        link.style.padding =
            "8px 14px";

        link.style.borderRadius =
            "4px";

        link.style.textDecoration =
            "none";

        link.style.fontWeight =
            "bold";


        checkoutMessage.appendChild(
            text
        );

        checkoutMessage.appendChild(
            link
        );

        chatMessages.appendChild(
            checkoutMessage
        );
    }


    // ========================================================
    // TYPING INDICATOR
    // ========================================================

    function removeTypingIndicator() {

        const indicator =
            document.getElementById(
                "typingIndicator"
            );

        if (indicator) {

            indicator.remove();
        }
    }


    // ========================================================
    // SCROLL
    // ========================================================

    function scrollToBottom() {

        chatMessages.scrollTop =
            chatMessages.scrollHeight;
    }

</script>

</body>

</html>
